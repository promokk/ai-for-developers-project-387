name: Kimi Code PR Writer

on:
  # Секреты и write token доступны только после проверки доверенного автора и same-repo PR.
  # jactionlint ignore=dangerous-triggers
  issue_comment:
    types: [created]
  # jactionlint ignore=dangerous-triggers
  pull_request_review_comment:
    types: [created]

permissions: {}

concurrency:
  group: kimi-pr-writer-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      valid: ${{ steps.command.outputs.valid }}
      mode: ${{ steps.command.outputs.mode }}
      number: ${{ steps.command.outputs.number }}
      head-sha: ${{ steps.command.outputs.headSha }}
      head-ref: ${{ steps.command.outputs.headRef }}
    steps:
      - name: Checkout trusted event filters
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate trusted command and exact PR head
        id: command
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/pr-agent.mjs validate

  write:
    needs: validate
    if: needs.validate.outputs.valid == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Create scoped writer token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.KIMI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KIMI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Checkout exact same-repo PR head
        if: needs.validate.outputs.mode == 'pr'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.head-sha }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Checkout main for implement-spec
        if: needs.validate.outputs.mode == 'implement-spec'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Create implementation branch from origin/main
        if: needs.validate.outputs.mode == 'implement-spec'
        env:
          ISSUE_NUMBER: ${{ needs.validate.outputs.number }}
        run: git switch -c "agent/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}" origin/main

      - name: Setup project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Install JS dependencies
        run: mise run install:js

      - name: Build acceptance-test or existing-PR context
        id: context
        shell: bash
        env:
          AGENT_MODE: ${{ needs.validate.outputs.mode }}
          AGENT_PHASE: ${{ needs.validate.outputs.mode == 'implement-spec' && 'acceptance' || 'pr' }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ needs.validate.outputs.head-sha }}
          TARGET_NUMBER: ${{ needs.validate.outputs.number }}
        run: node .github/scripts/pr-agent.mjs context

      - name: Run phase 1 acceptance writer or existing-PR writer
        shell: bash
        env:
          KIMI_CODE_HOME: ${{ runner.temp }}/kimi-code-home
          KIMI_CODE_NO_AUTO_UPDATE: "1"
          KIMI_DISABLE_TELEMETRY: "1"
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_MODEL_BASE_URL: https://api.kimi.com/coding/v1
          KIMI_MODEL_NAME: k3.1-pro
        run: |
          mise exec -- pnpm exec kimi --agent-file .kimi-code/agents/github-pr-writer.md \
            --prompt "$(cat "$RUNNER_TEMP/agent-prompt.txt")" \
            > "$RUNNER_TEMP/agent-response.md"
          if [[ ! -s "$RUNNER_TEMP/agent-response.md" ]]; then
            echo "Kimi Code returned an empty response" >&2
            exit 1
          fi

      - name: Allow only acceptance-test files in phase 1
        if: needs.validate.outputs.mode == 'implement-spec'
        env:
          TEST_SCOPE: ${{ steps.context.outputs.testScope }}
        run: node .github/scripts/pr-agent.mjs assert-test-only

      - name: Require real nonzero acceptance test before implementation
        if: needs.validate.outputs.mode == 'implement-spec'
        shell: bash
        env:
          TEST_SCOPE: ${{ steps.context.outputs.testScope }}
        run: |
          set +e
          if [[ "$TEST_SCOPE" == "frontend" ]]; then
            mise run test:frontend > "$RUNNER_TEMP/acceptance-red.log" 2>&1
          else
            mise run test > "$RUNNER_TEMP/acceptance-red.log" 2>&1
          fi
          status=$?
          set -e
          cat "$RUNNER_TEMP/acceptance-red.log"
          if [[ $status -eq 0 ]]; then
            echo "Acceptance tests are unexpectedly green before implementation" >&2
            exit 1
          fi
          echo "Expected red confirmed: acceptance command exited with $status before implementation."

      - name: Run full project checks for existing PR
        if: needs.validate.outputs.mode == 'pr'
        run: mise run check

      - name: Reject protected or empty changes in existing PR
        if: needs.validate.outputs.mode == 'pr'
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Agent made no changes" >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain -- .github/workflows/hexlet-check.yml)" ]]; then
            echo "hexlet-check.yml must not be changed" >&2
            exit 1
          fi
          git diff --check

      - name: Recheck unchanged PR head before writing
        if: needs.validate.outputs.mode == 'pr'
        shell: bash
        env:
          EXPECTED_HEAD: ${{ needs.validate.outputs.head-sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ needs.validate.outputs.number }}
        run: |
          actual=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)
          if [[ "$actual" != "$EXPECTED_HEAD" ]]; then
            echo "PR head changed; refusing to overwrite $actual with changes for $EXPECTED_HEAD" >&2
            exit 1
          fi

      - name: Commit verified existing-PR changes
        if: needs.validate.outputs.mode == 'pr'
        shell: bash
        env:
          TARGET_NUMBER: ${{ needs.validate.outputs.number }}
        run: |
          git config user.name "kimi-code[bot]"
          git config user.email "kimi-code[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: применить проверенный запрос из PR #${TARGET_NUMBER}"

      - name: Push fix to the same existing PR branch
        if: needs.validate.outputs.mode == 'pr'
        env:
          HEAD_REF: ${{ needs.validate.outputs.head-ref }}
        run: git push origin "HEAD:${HEAD_REF}"

      - name: Commit only red acceptance tests
        if: needs.validate.outputs.mode == 'implement-spec'
        id: red-commit
        shell: bash
        env:
          SPEC_NUMBER: ${{ steps.context.outputs.specNumber }}
          TEST_SCOPE: ${{ steps.context.outputs.testScope }}
        run: |
          git config user.name "kimi-code[bot]"
          git config user.email "kimi-code[bot]@users.noreply.github.com"
          if [[ "$TEST_SCOPE" == "frontend" ]]; then
            git add -A -- frontend/tests
          else
            git add -A -- backend/tests
          fi
          git diff --cached --check
          git commit -m "test: добавить приёмочные тесты спецификации #${SPEC_NUMBER}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push red tests to new implementation branch
        if: needs.validate.outputs.mode == 'implement-spec'
        env:
          ISSUE_NUMBER: ${{ needs.validate.outputs.number }}
        run: git push --set-upstream origin "agent/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"

      - name: Create draft PR for red acceptance commit
        if: needs.validate.outputs.mode == 'implement-spec'
        id: create-pr
        shell: bash
        env:
          BODY_PHASE: acceptance
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ needs.validate.outputs.number }}
          RED_COMMIT: ${{ steps.red-commit.outputs.sha }}
          SPEC_NUMBER: ${{ steps.context.outputs.specNumber }}
        run: |
          node .github/scripts/pr-agent.mjs pr-body
          gh pr create --draft --base main --head "agent/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}" \
            --title "Реализация спецификации #${SPEC_NUMBER}" \
            --body-file "$RUNNER_TEMP/agent-pr-body.md" \
            > "$RUNNER_TEMP/pr-url.txt"
          pr_url=$(cat "$RUNNER_TEMP/pr-url.txt")
          echo "$pr_url"
          echo "number=$(gh pr view "$pr_url" --json number --jq .number)" >> "$GITHUB_OUTPUT"

      - name: Wait for real red CI on draft PR
        if: needs.validate.outputs.mode == 'implement-spec'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RED_COMMIT: ${{ steps.red-commit.outputs.sha }}
        run: |
          run_id=""
          for _ in {1..30}; do
            run_id=$(gh run list --commit "$RED_COMMIT" --workflow check.yml --event pull_request \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            echo "Red CI run was not created for $RED_COMMIT" >&2
            exit 1
          fi
          set +e
          gh run watch "$run_id" --interval 10 --exit-status
          set -e
          conclusion=$(gh run view "$run_id" --json conclusion --jq .conclusion)
          if [[ "$conclusion" != "failure" ]]; then
            echo "Red CI unexpectedly concluded $conclusion instead of failure" >&2
            exit 1
          fi
          gh run view "$run_id" --json url --jq .url > "$RUNNER_TEMP/red-ci-url.txt"
          echo "Expected red CI confirmed in run $run_id for $RED_COMMIT."

      - name: Build phase 2 implementation context
        if: needs.validate.outputs.mode == 'implement-spec'
        id: implementation-context
        shell: bash
        env:
          AGENT_MODE: implement-spec
          AGENT_PHASE: implementation
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_NUMBER: ${{ needs.validate.outputs.number }}
        run: node .github/scripts/pr-agent.mjs context

      - name: Run separate phase 2 implementation writer
        if: needs.validate.outputs.mode == 'implement-spec'
        shell: bash
        env:
          KIMI_CODE_HOME: ${{ runner.temp }}/kimi-code-implementation-home
          KIMI_CODE_NO_AUTO_UPDATE: "1"
          KIMI_DISABLE_TELEMETRY: "1"
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_MODEL_BASE_URL: https://api.kimi.com/coding/v1
          KIMI_MODEL_NAME: k3.1-pro
        run: |
          mise exec -- pnpm exec kimi --agent-file .kimi-code/agents/github-pr-writer.md \
            --prompt "$(cat "$RUNNER_TEMP/agent-prompt.txt")" \
            > "$RUNNER_TEMP/agent-response.md"
          if [[ ! -s "$RUNNER_TEMP/agent-response.md" ]]; then
            echo "Kimi Code returned an empty implementation response" >&2
            exit 1
          fi

      - name: Reject protected or empty implementation changes
        if: needs.validate.outputs.mode == 'implement-spec'
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Implementation agent made no changes" >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain -- .github/workflows/hexlet-check.yml)" ]]; then
            echo "hexlet-check.yml must not be changed" >&2
            exit 1
          fi
          git diff --check

      - name: Run full project checks after implementation
        if: needs.validate.outputs.mode == 'implement-spec'
        run: mise run check

      - name: Create green feature commit
        if: needs.validate.outputs.mode == 'implement-spec'
        id: green-commit
        shell: bash
        env:
          SPEC_NUMBER: ${{ steps.implementation-context.outputs.specNumber }}
        run: |
          git add -A
          git diff --cached --check
          git commit -m "feat: реализовать спецификацию #${SPEC_NUMBER}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push implementation to the same draft PR branch
        if: needs.validate.outputs.mode == 'implement-spec'
        env:
          ISSUE_NUMBER: ${{ needs.validate.outputs.number }}
        run: git push origin "HEAD:agent/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"

      - name: Update and mark the same PR ready for review
        if: needs.validate.outputs.mode == 'implement-spec'
        shell: bash
        env:
          BODY_PHASE: implementation
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GREEN_COMMIT: ${{ steps.green-commit.outputs.sha }}
          ISSUE_NUMBER: ${{ needs.validate.outputs.number }}
          PR_NUMBER: ${{ steps.create-pr.outputs.number }}
          RED_COMMIT: ${{ steps.red-commit.outputs.sha }}
          SPEC_NUMBER: ${{ steps.implementation-context.outputs.specNumber }}
        run: |
          RED_CI_URL="$(cat "$RUNNER_TEMP/red-ci-url.txt")"
          export RED_CI_URL
          node .github/scripts/pr-agent.mjs pr-body
          gh pr edit "$PR_NUMBER" --body-file "$RUNNER_TEMP/agent-pr-body.md"
          gh pr ready "$PR_NUMBER"

      - name: Publish success
        shell: bash
        env:
          AGENT_MODE: ${{ needs.validate.outputs.mode }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_NUMBER: ${{ needs.validate.outputs.number }}
        run: |
          commit=$(git rev-parse HEAD)
          if [[ "$AGENT_MODE" == "implement-spec" ]]; then
            result="Draft PR с red тестами переведён в ready for review после зелёного check: $(cat "$RUNNER_TEMP/pr-url.txt")."
          else
            result="Исправление отправлено в текущую ветку PR."
          fi
          {
            cat "$RUNNER_TEMP/agent-response.md"
            printf "\n\nКоммит \`%s\`. %s [Прогон Actions](%s/%s/actions/runs/%s).\n" \
              "$commit" "$result" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/success-comment.md"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${TARGET_NUMBER}/comments" \
            --raw-field body="$(cat "$RUNNER_TEMP/success-comment.md")"

      - name: Report failure
        if: failure() && steps.app-token.outputs.token != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_NUMBER: ${{ needs.validate.outputs.number }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${TARGET_NUMBER}/comments" \
            --raw-field body="Не удалось выполнить команду Kimi Code. Код main не изменён; draft PR, если он был создан, не переведён в ready for review. Подробности доступны в [прогоне Actions](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
